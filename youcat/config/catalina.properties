# tomcat-base
tomcat.connector.secure=false
tomcat.connector.scheme=http
tomcat.connector.proxyName=localhost
tomcat.connector.proxyPort=9090

# database connection pools
org.opencadc.youcat.tapadm.maxActive=5
org.opencadc.youcat.tapadm.username=tapadm
org.opencadc.youcat.tapadm.password=pw-tapadm
org.opencadc.youcat.tapadm.url=jdbc:postgresql://postgres-metadata:5432/metadata

org.opencadc.youcat.tapuser.maxActive=5
org.opencadc.youcat.tapuser.username=tapuser
org.opencadc.youcat.tapuser.password=pw-tapuser
org.opencadc.youcat.tapuser.url=jdbc:postgresql://postgres-metadata:5432/metadata

org.opencadc.youcat.uws.maxActive=5
org.opencadc.youcat.uws.username=tapadm
org.opencadc.youcat.uws.password=pw-tapadm
org.opencadc.youcat.uws.url=jdbc:postgresql://postgres-metadata:5432/metadata

# Identity Manager implementation
ca.nrc.cadc.auth.IdentityManager=org.opencadc.auth.StandardIdentityManager
